server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Direct API calls (frontend JS uses ri="/api")
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Sub-path API calls (from external proxy /mondai/api/)
    location /mondai/api/ {
        rewrite ^/mondai/api/(.*) /api/$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Direct uploads
    location /uploads/ {
        proxy_pass http://backend:3000;
    }

    # Sub-path uploads
    location /mondai/uploads/ {
        rewrite ^/mondai/(.*) /$1 break;
        proxy_pass http://backend:3000;
    }

    location /mondai/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = / {
        return 301 $scheme://$http_host/mondai/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
