name: taskflow-qas

# QAS uses the exact same images built by docker-compose.dev.yml.
# Never build here — always promote from DEV via deploy-dev.sh.

services:
  frontend:
    image: taskflow-frontend:dev
    ports:
      - "5302:80"
    networks:
      - net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: taskflow-backend:dev
    environment:
      DATABASE_URL: postgresql://taskflow:${DB_PASSWORD}@db:5432/taskflow_qas
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_URL: ${APP_URL}
      PORT: "3000"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    networks:
      - net
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskflow_qas
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - net
    restart: unless-stopped

networks:
  net:
    driver: bridge

volumes:
  db-data:
