name: Deploy QAS

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Deploy QAS
        run: |
          cd /opt/taskflow-qas
          git pull origin staging
          bash deploy-qas.sh
