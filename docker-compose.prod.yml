services:
  frontend:
    build:
      context: ./taskflow-ai-mockup
      dockerfile: Dockerfile
    image: taskflow-frontend:prod
    ports:
      - "5300:80"
    networks:
      - net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./taskflow-ai-backend
      dockerfile: Dockerfile
    image: taskflow-backend:prod
    environment:
      DATABASE_URL: postgresql://taskflow:${DB_PASSWORD}@db:5432/taskflow_prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_URL: ${APP_URL}
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskflow_prod
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  net:
    driver: bridge

volumes:
  db-data:
